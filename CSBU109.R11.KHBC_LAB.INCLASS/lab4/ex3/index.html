<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Forecast (Client Web UI)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #74b9ff, #a29bfe);
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      box-sizing: border-box;
    }
    .container {
      background: white;
      max-width: 500px;
      width: 100%;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }
    h2 {
      margin-top: 0;
      text-align: center;
      color: #2d3436;
    }
    .subtitle {
      text-align: center;
      color: #636e72;
      font-size: 14px;
      margin-top: -10px;
      margin-bottom: 25px;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #dfe6e9;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #6c5ce7;
    }
    button {
      padding: 12px 20px;
      background: #6c5ce7;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #5b4bc4;
    }
    .quick-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .chip {
      background: #f1f2f6;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      color: #2f3542;
      cursor: pointer;
      transition: background 0.2s;
    }
    .chip:hover {
      background: #dfe4ea;
    }
    .error-box {
      display: none;
      padding: 12px;
      background: #ff7675;
      color: white;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: bold;
      text-align: center;
    }
    .weather-card {
      display: none;
      background: linear-gradient(135deg, #0984e3, #74b9ff);
      color: white;
      border-radius: 12px;
      padding: 25px;
      text-align: center;
      margin-top: 20px;
      box-shadow: 0 4px 15px rgba(9, 132, 227, 0.3);
    }
    .city-name {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .temp {
      font-size: 54px;
      font-weight: 800;
      margin: 15px 0;
    }
    .details {
      display: flex;
      justify-content: space-around;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.3);
      font-size: 14px;
    }
    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .loading {
      display: none;
      text-align: center;
      color: #6c5ce7;
      font-weight: bold;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🌤️ Dự Báo Thời Tiết</h2>
    <p class="subtitle">Lab 4 - Exercise 3: Weather Service API</p>

    <div class="search-box">
      <input type="text" id="city-input" placeholder="Nhập tên thành phố (vd: Hanoi, Tokyo...)" value="Hanoi">
      <button id="search-btn">Tìm Kiếm</button>
    </div>

    <div class="quick-chips">
      <span class="chip" onclick="searchFor('Hanoi')">Hanoi</span>
      <span class="chip" onclick="searchFor('Ho Chi Minh')">TP. HCM</span>
      <span class="chip" onclick="searchFor('Da Nang')">Đà Nẵng</span>
      <span class="chip" onclick="searchFor('Tokyo')">Tokyo</span>
      <span class="chip" onclick="searchFor('London')">London</span>
      <span class="chip" onclick="searchFor('Paris')">Paris</span>
    </div>

    <div id="error-msg" class="error-box"></div>
    <div id="loading" class="loading">Đang tải dữ liệu thời tiết...</div>

    <div id="weather-card" class="weather-card">
      <div id="res-city" class="city-name"></div>
      <div id="res-temp" class="temp"></div>
      <div class="details">
        <div>
          <span>Tốc độ gió</span>
          <br>
          <strong id="res-wind"></strong>
        </div>
        <div>
          <span>Thời gian ghi nhận</span>
          <br>
          <strong id="res-time"></strong>
        </div>
      </div>
      <div id="res-cache" class="badge"></div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:5003/api/v1/weather';

    const cityInput = document.getElementById('city-input');
    const searchBtn = document.getElementById('search-btn');
    const errorBox = document.getElementById('error-msg');
    const loadingBox = document.getElementById('loading');
    const weatherCard = document.getElementById('weather-card');

    searchBtn.addEventListener('click', () => fetchWeather(cityInput.value.trim()));
    cityInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') fetchWeather(cityInput.value.trim());
    });

    function searchFor(cityName) {
      cityInput.value = cityName;
      fetchWeather(cityName);
    }

    async function fetchWeather(city) {
      if (!city) {
        showError('Vui lòng nhập tên thành phố!');
        return;
      }

      errorBox.style.display = 'none';
      weatherCard.style.display = 'none';
      loadingBox.style.display = 'block';

      try {
        const res = await fetch(`${API_BASE}?city=${encodeURIComponent(city)}`);
        const isJson = res.headers.get('content-type')?.includes('application/json');
        const data = isJson ? await res.json() : null;

        if (!res.ok) {
          throw new Error((data && data.message) || `Lỗi ${res.status}: Backend chưa chạy tại cổng 5003.`);
        }

        renderWeather(data.data);
      } catch (err) {
        showError(err.message);
      } finally {
        loadingBox.style.display = 'none';
      }
    }

    function renderWeather(data) {
      document.getElementById('res-city').textContent = data.city;
      document.getElementById('res-temp').textContent = `${data.temperatureC}°C`;
      document.getElementById('res-wind').textContent = `${data.windSpeedKmh} km/h`;
      
      const timeStr = data.observedAt ? new Date(data.observedAt).toLocaleString('vi-VN') : 'Hiện tại';
      document.getElementById('res-time').textContent = timeStr;

      const cacheBadge = document.getElementById('res-cache');
      if (data.fromCache) {
        cacheBadge.textContent = '⚡ Dữ liệu từ Cache (5 phút)';
      } else {
        cacheBadge.textContent = '🌐 Dữ liệu mới từ Open-Meteo';
      }

      weatherCard.style.display = 'block';
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }

    // Tự động tìm kiếm thành phố mặc định khi mở trang
    window.addEventListener('DOMContentLoaded', () => {
      if (cityInput.value) {
        fetchWeather(cityInput.value);
      }
    });
  </script>
</body>
</html>
